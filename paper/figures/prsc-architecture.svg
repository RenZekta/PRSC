<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#40546b"/></marker>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#142233}
      .head{font:700 21px Arial,sans-serif;fill:#142233}
      .body{font:16px Arial,sans-serif;fill:#304255}
      .small{font:14px Arial,sans-serif;fill:#536579}
      .box{stroke:#42576d;stroke-width:2;rx:18;ry:18}
      .arrow{stroke:#40546b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dashed{stroke-dasharray:9 7}
    </style>
  </defs>
  <rect width="1500" height="820" fill="#ffffff"/>
  <text x="750" y="48" text-anchor="middle" class="title">Prior-Relative Sparse Context (PRSC)</text>
  <rect x="60" y="100" width="300" height="170" fill="#edf3fb" class="box"/>
  <text x="210" y="140" text-anchor="middle" class="head">Source archive</text>
  <text x="210" y="177" text-anchor="middle" class="body">Documents · code · history</text>
  <text x="210" y="207" text-anchor="middle" class="body">Raw facts · exceptions · links</text>
  <text x="210" y="240" text-anchor="middle" class="small">Versioned, hashed source spans</text>

  <rect x="430" y="100" width="330" height="170" fill="#f3f0ff" class="box"/>
  <text x="595" y="140" text-anchor="middle" class="head">PRSC compiler</text>
  <text x="595" y="177" text-anchor="middle" class="body">Parse · match patterns</text>
  <text x="595" y="207" text-anchor="middle" class="body">Estimate residual · validate</text>
  <text x="595" y="240" text-anchor="middle" class="small">Model-conditioned, not weight-address lookup</text>
  <path d="M360 185 H425" class="arrow"/>

  <rect x="835" y="85" width="600" height="215" fill="#eaf7f1" class="box"/>
  <text x="1135" y="123" text-anchor="middle" class="head">Persistent K-gram memory + hybrid index</text>
  <rect x="875" y="150" width="245" height="105" fill="#ffffff" class="box"/>
  <text x="997" y="183" text-anchor="middle" class="head">Knowledge Grams</text>
  <text x="997" y="214" text-anchor="middle" class="small">Pattern ref + residual</text>
  <text x="997" y="237" text-anchor="middle" class="small">Provenance + exact fallback</text>
  <rect x="1150" y="150" width="245" height="105" fill="#ffffff" class="box"/>
  <text x="1272" y="183" text-anchor="middle" class="head">Index + graph</text>
  <text x="1272" y="214" text-anchor="middle" class="small">Exact · semantic · relations</text>
  <text x="1272" y="237" text-anchor="middle" class="small">Dependency closure</text>
  <path d="M760 185 H830" class="arrow"/>

  <rect x="60" y="390" width="300" height="150" fill="#fff6e9" class="box"/>
  <text x="210" y="435" text-anchor="middle" class="head">Query + task</text>
  <text x="210" y="475" text-anchor="middle" class="body">Intent · constraints</text>
  <text x="210" y="505" text-anchor="middle" class="small">Precision and risk requirements</text>

  <rect x="430" y="365" width="330" height="200" fill="#fff1e7" class="box"/>
  <text x="595" y="410" text-anchor="middle" class="head">Activation controller</text>
  <text x="595" y="450" text-anchor="middle" class="body">Retrieve · rank · expand</text>
  <text x="595" y="480" text-anchor="middle" class="body">Check confidence and versions</text>
  <text x="595" y="520" text-anchor="middle" class="small">Choose cache / reconstruct / source</text>
  <path d="M360 465 H425" class="arrow"/>
  <path d="M1000 300 C1000 330 760 320 700 360" class="arrow"/>
  <path d="M1270 300 C1270 350 800 320 750 405" class="arrow"/>

  <rect x="835" y="365" width="280" height="200" fill="#edf6ff" class="box"/>
  <text x="975" y="410" text-anchor="middle" class="head">Activation paths</text>
  <text x="975" y="450" text-anchor="middle" class="body">Compatible KV cache</text>
  <text x="975" y="480" text-anchor="middle" class="body">Pattern + residual</text>
  <text x="975" y="510" text-anchor="middle" class="body">Exact source expansion</text>
  <path d="M760 465 H830" class="arrow"/>

  <rect x="1190" y="365" width="245" height="200" fill="#eef8f8" class="box"/>
  <text x="1312" y="410" text-anchor="middle" class="head">Active workspace</text>
  <text x="1312" y="450" text-anchor="middle" class="body">Small query-specific set</text>
  <text x="1312" y="480" text-anchor="middle" class="body">Provenance retained</text>
  <text x="1312" y="520" text-anchor="middle" class="small">Only selected items activated</text>
  <path d="M1115 465 H1185" class="arrow"/>

  <rect x="430" y="665" width="1005" height="95" fill="#f5f6f8" class="box"/>
  <text x="932" y="705" text-anchor="middle" class="head">Base model M</text>
  <text x="932" y="735" text-anchor="middle" class="body">Uses active workspace; expands retrieval if evidence is insufficient</text>
  <path d="M1312 565 V625 H932 V660" class="arrow"/>

  <path d="M210 270 V385" class="arrow dashed"/>
  <text x="230" y="335" class="small">Exact-source fallback</text>
</svg>

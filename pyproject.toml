[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prsc-knowledge-grams"
version = "0.1.0"
description = "Draft data model and validator for Prior-Relative Sparse Context research"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PRSC contributors" }]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3"]

[tool.setuptools.packages.find]
where = ["src"]
